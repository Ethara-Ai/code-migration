[project]
name = "java-migration-agent"
version = "0.1.0"
description = "Java Migration Agent with LLM-based migration capabilities"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core dependencies
    "toml>=0.10.2",
    "packaging>=21.0",
    "boto3>=1.40.41",

    # Strands framework for LLM agents. The anthropic extra backs
    # --model-provider anthropic.
    "strands-agents[openai,anthropic]>=1.18.0",
    "strands-agents-tools>=0.2.16",

    # HuggingFace datasets
    "datasets>=2.14.0",
    "huggingface-hub>=0.16.0",

    # Evaluation from migration-bench
    # Pinned: r5 grades against a 240-entry dependency_version.json inside this
    # repo, so a floating ref would make maximal verdicts depend on whatever
    # main said that day.
    "migrationbench@git+https://github.com/amazon-science/MigrationBench.git@d705e9b1a8b6fb24212248a373dfd3fbae614d07",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/strands_agent"]

[tool.uv]
# UV-specific configuration
index-url = "https://pypi.org/simple"
